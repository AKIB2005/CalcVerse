<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EngCalc — Engineering Calculator</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EngCalc" />
  <meta name="theme-color" content="#818cf8" />
  <meta name="description" content="Premium engineering calculator — scientific, unit conversion, toolkit." />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Animated background blobs -->
<div class="bg-blobs" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="app-container">

  <!-- ── HEADER ─────────────────────────────────────────────── -->
  <header class="app-header glass-panel">
    <div class="header-left">
      <span class="app-logo">⚙ EngCalc</span>
      <nav class="mode-tabs" role="tablist" aria-label="Calculator mode">
        <button class="mode-tab active" data-mode="basic"   role="tab" aria-selected="true">Basic</button>
        <button class="mode-tab"        data-mode="sci"     role="tab" aria-selected="false">Scientific</button>
        <button class="mode-tab"        data-mode="eng"     role="tab" aria-selected="false">Engineering</button>
        <button class="mode-tab"        data-mode="toolkit" role="tab" aria-selected="false">Toolkit</button>
      </nav>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="historyToggle" title="Calculation History" aria-label="Toggle history panel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </button>
      <button class="icon-btn theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle light/dark mode">
        <svg class="icon-sun"  width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- ── MAIN LAYOUT ────────────────────────────────────────── -->
  <main class="main-layout">

    <!-- Calculator panel (Basic + Scientific share this) -->
    <section class="calc-section" id="calcSection">

      <!-- Display -->
      <div class="display-panel glass-panel" id="displayPanel">
        <div class="display-angle-mode" id="angleMode">DEG</div>
        <div class="display-memory"    id="memoryDisplay"></div>
        <div class="display-expr"      id="exprDisplay"   aria-live="polite">0</div>
        <div class="display-result"    id="resultDisplay"></div>
        <div class="display-actions">
          <button class="display-action-btn" id="copyBtn" title="Copy result" aria-label="Copy result">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
          <button class="display-action-btn" id="pasteBtn" title="Paste expression" aria-label="Paste expression">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
            Paste
          </button>
        </div>
      </div>

      <!-- Scientific extra row -->
      <div class="sci-extras glass-panel" id="sciExtras" hidden>
        <div class="angle-selector">
          <button class="angle-btn active" data-angle="deg">DEG</button>
          <button class="angle-btn" data-angle="rad">RAD</button>
          <button class="angle-btn" data-angle="grad">GRAD</button>
        </div>
        <div class="sci-shift-row">
          <button class="shift-btn" id="shiftBtn" title="Shift / 2nd functions">2nd</button>
        </div>
      </div>

      <!-- Button grid -->
      <div class="btn-grid glass-panel" id="btnGrid" role="group" aria-label="Calculator buttons"></div>

    </section>

    <!-- History side panel (desktop) -->
    <aside class="history-panel glass-panel" id="historyPanel" aria-label="Calculation history">
      <div class="history-header">
        <h2>History</h2>
        <button class="icon-btn" id="clearHistoryBtn" title="Clear all history" aria-label="Clear all history">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
      <div class="history-list" id="historyList">
        <p class="history-empty">No calculations yet</p>
      </div>
    </aside>

  </main>

  <!-- ── ENGINEERING MODE ───────────────────────────────────── -->
  <section class="eng-section full-section" id="engSection" hidden>
    <div id="engContent"></div>
  </section>

  <!-- ── TOOLKIT MODE ───────────────────────────────────────── -->
  <section class="toolkit-section full-section" id="toolkitSection" hidden>
    <div id="toolkitContent"></div>
  </section>

</div><!-- /app-container -->

<!-- History drawer overlay (mobile) -->
<div class="history-overlay" id="historyOverlay" aria-hidden="true"></div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
